          title: "Affected Forms"
        affected_calculations:
          items:
            type: "string"
          type: "array"
          title: "Affected Calculations"
        affected_lessons:
          items:
            type: "string"
          type: "array"
          title: "Affected Lessons"
        effective_note_tr:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Effective Note Tr"
          description: "Hangi tarihten itibaren hangi iş değişir"
