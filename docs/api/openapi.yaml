        calorific_value:
          anyOf:
            - additionalProperties: true
              type: "object"
            - type: "null"
          title: "Calorific Value"
        basis_conversion:
          anyOf:
            - additionalProperties: true
              type: "object"
            - type: "null"
          title: "Basis Conversion"
        reference_conditions:
          anyOf:
            - additionalProperties: true
              type: "object"
            - type: "null"
          title: "Reference Conditions"
