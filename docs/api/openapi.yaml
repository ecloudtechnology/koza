components:
  schemas:
    ActivityCreate:
      properties:
        period_id:
          type: "string"
          title: "Period Id"
        source_type:
          type: "string"
          minLength: 1
          title: "Source Type"
        fuel:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Fuel"
        quantity:
          anyOf:
            - type: "string"
              pattern: "^-?\\d+(\\.\\d+)?$"
              description: "Ondalık dize; sayı değil"
            - type: "null"
          title: "Quantity"
        quantity_state:
          type: "string"
          enum:
            - "known"
            - "unknown"
            - "not_applicable"
          title: "Quantity State"
          default: "unknown"
        not_applicable_reason:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Not Applicable Reason"
        unit:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Unit"
        heating_value_basis:
          anyOf:
            - type: "string"
              enum:
                - "LHV"
                - "HHV"
            - type: "null"
          title: "Heating Value Basis"
        data_quality:
          type: "string"
          enum:
            - "measured"
            - "estimated"
          title: "Data Quality"
          default: "measured"
        activity_start:
          type: "string"
          format: "date"
          title: "Activity Start"
        activity_end:
          type: "string"
          format: "date"
          title: "Activity End"
        note:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Note"
        source_id:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Source Id"
      additionalProperties: false
      type: "object"
      required:
        - "period_id"
        - "source_type"
        - "activity_start"
        - "activity_end"
      title: "ActivityCreate"
    ActivityPatch:
      properties:
        expected_version:
          anyOf:
            - type: "integer"
            - type: "null"
          title: "Expected Version"
          description: "If-Match başlığına alternatif"
        change_reason:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Change Reason"
        fuel:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Fuel"
        quantity:
          anyOf:
            - type: "string"
              pattern: "^-?\\d+(\\.\\d+)?$"
              description: "Ondalık dize; sayı değil"
            - type: "null"
          title: "Quantity"
        quantity_state:
          anyOf:
            - type: "string"
              enum:
                - "known"
                - "unknown"
                - "not_applicable"
            - type: "null"
          title: "Quantity State"
        not_applicable_reason:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Not Applicable Reason"
        unit:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Unit"
        heating_value_basis:
          anyOf:
            - type: "string"
              enum:
                - "LHV"
                - "HHV"
            - type: "null"
          title: "Heating Value Basis"
        data_quality:
          anyOf:
            - type: "string"
              enum:
                - "measured"
                - "estimated"
            - type: "null"
          title: "Data Quality"
        activity_start:
          anyOf:
            - type: "string"
              format: "date"
            - type: "null"
          title: "Activity Start"
        activity_end:
          anyOf:
            - type: "string"
              format: "date"
            - type: "null"
          title: "Activity End"
        note:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Note"
      additionalProperties: false
      type: "object"
      title: "ActivityPatch"
      description: "Kısmi güncelleme. Verilmeyen alan korunur; açık `null` 'bilinmiyor' demektir\n(pydantic `model_fields_set` ile ayırt edilir)."
    AggregatePolicy:
      properties:
        include_states:
          items:
            type: "string"
            enum:
              - "draft"
              - "validation_required"
              - "calculated"
              - "in_review"
              - "changes_requested"
              - "approved"
              - "locked"
          type: "array"
          title: "Include States"
        scope2_method:
          type: "string"
          enum:
            - "location_based"
            - "market_based"
          title: "Scope2 Method"
          default: "location_based"
      additionalProperties: false
      type: "object"
      title: "AggregatePolicy"
    AggregateRequest:
      properties:
        period_id:
          type: "string"
          title: "Period Id"
        policy:
          "$ref": "#/components/schemas/AggregatePolicy"
      additionalProperties: false
      type: "object"
      required:
        - "period_id"
      title: "AggregateRequest"
    ApprovalRequest:
      properties:
        record_id:
          type: "string"
          title: "Record Id"
        expected_version:
          type: "integer"
          title: "Expected Version"
        decision:
          type: "string"
          enum:
            - "approve"
            - "request_changes"
          title: "Decision"
        comment:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Comment"
        self_approval_reason:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Self Approval Reason"
      additionalProperties: false
      type: "object"
      required:
        - "record_id"
        - "expected_version"
        - "decision"
      title: "ApprovalRequest"
    CalculateRequest:
      properties:
        factor_refs:
          items:
            "$ref": "#/components/schemas/FactorRef"
