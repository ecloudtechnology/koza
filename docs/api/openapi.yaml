# Üretilmiş dosya — elle düzenlemeyin. Kaynak: apps/api/scripts/export_openapi.py
openapi: "3.1.0"
info:
  title: "Koza API"
  description: "Koza iş API'si — Dilim 1. Zarf: {data, meta, request_id}; hata: {code, message, field_errors, retryable, request_id}. Kurum bağlamı X-Tenant başlığı + üyelikten doğrulanır; gövdedeki tenant_id reddedilir."
  version: "0.2.0"
paths:
  /healthz:
    get:
      tags:
        - "ops"
      summary: "Sağlık"
      operationId: "healthz_healthz_get"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
  /v1/activities:
    post:
      tags:
        - "activities"
      summary: "Taslak oluştur (Idempotency-Key zorunlu)"
      description: "201 + kayıt/sürüm. Aynı Idempotency-Key + aynı gövde → aynı yanıt; farklı gövde → 409 IDEMPOTENCY_MISMATCH.\nGövdede `tenant_id` kabul edilmez (422); kurum bağlamı X-Tenant + üyelikten gelir."
      operationId: "create_activity_v1_activities_post"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ActivityCreate"
        required: true
      responses:
        201:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/activities/{record_id}:
    get:
      tags:
        - "activities"
      summary: "Kaydı oku"
      operationId: "get_activity_v1_activities__record_id__get"
      parameters:
        - name: "record_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Record Id"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
    patch:
      tags:
        - "activities"
      summary: "Kaydı güncelle (beklenen sürüm zorunlu)"
      description: "If-Match: \"<version>\" veya gövde `expected_version` zorunlu (428). Uyuşmazlık → 409 VERSION_CONFLICT,\ngövdede güncel sürüm (T18). Kilitli dönem → 409 PERIOD_LOCKED (T17). Onaylı kayıtta veri değişikliği →\ndurum validation_required, onay geçersizleşir (§21)."
      operationId: "patch_activity_v1_activities__record_id__patch"
      parameters:
        - name: "record_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Record Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ActivityPatch"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/activities/{record_id}/versions:
    get:
      tags:
        - "activities"
      summary: "Sürüm geçmişi (append-only)"
      operationId: "get_activity_versions_v1_activities__record_id__versions_get"
      parameters:
        - name: "record_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Record Id"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/activities/{record_id}/submit:
    post:
      tags:
        - "activities"
      summary: "Kontrole gönder"
      description: "calculated → in_review. Güncel veri sürümü için geçerli (bloke olmayan) koşum şarttır;\ngerekçeli 'uygulanamaz' kayıt hesapsız gönderilebilir."
      operationId: "submit_activity_v1_activities__record_id__submit_post"
      parameters:
        - name: "record_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Record Id"
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
                - "$ref": "#/components/schemas/SubmitRequest"
                - type: "null"
              title: "Body"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/activities/{record_id}/runs:
    get:
      tags:
        - "activities"
      summary: "Hesap koşumları (tümü korunur, T13)"
      operationId: "list_runs_v1_activities__record_id__runs_get"
      parameters:
        - name: "record_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Record Id"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/calculations/preview:
    post:
      tags:
        - "calculations"
      summary: "Hesap önizle (hiçbir şey saklanmaz)"
      description: "Girdi/faktör/yöntem sürümü ve motor sonucu döner; kayıt, koşum veya audit YAZILMAZ."
      operationId: "preview_v1_calculations_preview_post"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PreviewRequest"
        required: true
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/activities/{record_id}/calculate:
    post:
      tags:
        - "calculations"
      summary: "Hesapla (değişmez koşum ekler)"
      description: "Her çağrı yeni bir calculation_run + result ekler; önceki koşumlar silinmez (T13).\nOnaylı kayıtta yeni koşum durumu değiştirmez; onay eski koşuma bağlı kalır, yeni koşum öneri olarak listelenir."
      operationId: "calculate_v1_activities__record_id__calculate_post"
      parameters:
        - name: "record_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Record Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CalculateRequest"
      responses:
        201:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/calculations/aggregate:
    post:
      tags:
        - "calculations"
      summary: "Toplama (koza_calc.aggregate; kurumsal ve ürün ayrı; saklanmaz)"
      description: "Dönemdeki kayıtların koşumlarını politikayla motora verir: onaylı/kilitli kayıtlar onaylı koşumla, politika başka\ndurumları içeriyorsa güncel veri sürümünün son koşumuyla. Ürün çalışmaları `context=product` ile ayrı gider ve\nkurumsal toplama girmez (kural 8). Motor 0.2 yoksa 503 AGGREGATE_UNAVAILABLE; API toplam üretmez (kural 1)."
      operationId: "aggregate_v1_calculations_aggregate_post"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AggregateRequest"
        required: true
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/classifications/preview:
    post:
      tags:
        - "classifications"
      summary: "Kapsam/kategori önerisi (kural tabanlı; hiçbir şey saklanmaz)"
      description: "Kaynak türü + yakıt + kontrol ilişkisinden deterministik öneri. Yanıt: gerekçe (`rationale_tr`),\neksik sorular (`missing_questions`), kural kimliği ve sürümü. LLM kullanılmaz; sonuç bağlayıcı değildir."
      operationId: "preview_v1_classifications_preview_post"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ClassificationPreviewRequest"
        required: true
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/approvals:
    post:
      tags:
        - "approvals"
      summary: "Onay ver veya düzeltme iste"
      description: "in_review → approved (yalnız onaylayan, yazar olmayan) veya changes_requested (kontrolör/onaylayan).\nKarar değişmez iz olarak saklanır; kayıt yeni sürüm alır."
      operationId: "decide_v1_approvals_post"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ApprovalRequest"
        required: true
      responses:
        201:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/periods:
    get:
      tags:
        - "periods"
      summary: "Dönemleri listele"
      operationId: "list_periods_v1_periods_get"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
    post:
      tags:
        - "periods"
      summary: "Dönem oluştur"
      operationId: "create_period_v1_periods_post"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PeriodCreate"
        required: true
      responses:
        201:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/periods/{period_id}:
    get:
      tags:
        - "periods"
      summary: "Dönemi oku"
      operationId: "get_period_v1_periods__period_id__get"
      parameters:
        - name: "period_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Period Id"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/periods/{period_id}/lock:
    post:
      tags:
        - "periods"
      summary: "Dönemi kilitle (admin)"
      description: "Tüm kayıtlar onaylı olmalı (aksi 409 PERIOD_NOT_READY). Onaylı kayıtlar `locked` sürümü alır."
      operationId: "lock_period_v1_periods__period_id__lock_post"
      parameters:
        - name: "period_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Period Id"
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
                - "$ref": "#/components/schemas/PeriodLockRequest"
                - type: "null"
              title: "Body"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/periods/{period_id}/reopen:
    post:
      tags:
        - "periods"
      summary: "Kilitli dönemi yeniden aç (admin, gerekçe zorunlu)"
      description: "Gerekçe + onaylayan kaydedilir; eski rapor sürümleri korunur (silme ucu yoktur).\nKilitli kayıtlar `approved` durumuna döner; veri değişirse olağan akışla onay geçersizleşir."
      operationId: "reopen_period_v1_periods__period_id__reopen_post"
      parameters:
        - name: "period_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Period Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PeriodReopenRequest"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/reports:
    post:
      tags:
        - "reports"
      summary: "Rapor oluştur (sabit manifest)"
      description: "Şartname 202 + job_id öngörür (§27). Dilim 0'da kuyruk yoktur: manifest SENKRON üretilir ve yanıt\n202 ile `status: \"ready\"`, `job_id` = rapor kimliği döner. Önceki rapor sürümü varsa `supersede_reason`\nzorunludur; eski sürüm korunur (kural 9). Rapor dosyası (DOCX/PDF) henüz üretilmez."
      operationId: "create_report_v1_reports_post"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ReportCreate"
        required: true
      responses:
        202:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/reports/{report_id}:
    get:
      tags:
        - "reports"
      summary: "Raporu oku / indir"
      operationId: "get_report_v1_reports__report_id__get"
      parameters:
        - name: "report_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Report Id"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/evidence/uploads:
    post:
      tags:
        - "evidence"
      summary: "Kanıt yükleme oturumu (sha256 + ad + boyut)"
      description: "Kurum içinde aynı karma varsa `duplicate_candidates` listelenir (T07). Nesne deposu varsa `upload` içerik\nyükleme adresini verir; yoksa null. `scan_status` içerik yüklenip taranana kadar `pending`."
      operationId: "create_upload_v1_evidence_uploads_post"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EvidenceUploadRequest"
        required: true
      responses:
        201:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/evidence/uploads/{evidence_id}/content:
    put:
      tags:
        - "evidence"
      summary: "Kanıt içeriğini yükle (boyut/tür sınırı, karma doğrulaması, tarama)"
      description: "Ham gövde. Beyan edilen sha256 ile içerik karması uyuşmazsa dosya saklanmaz (422 EVIDENCE_HASH_MISMATCH).\nTarama kancası sonucu: clean | rejected | pending; `pending` kalan dosya indirilemez."
      operationId: "upload_content_v1_evidence_uploads__evidence_id__content_put"
      parameters:
        - name: "evidence_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Evidence Id"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/evidence/{evidence_id}:
    get:
      tags:
        - "evidence"
      summary: "Kanıt üst verisi"
      operationId: "get_evidence_v1_evidence__evidence_id__get"
      parameters:
        - name: "evidence_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Evidence Id"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/evidence/{evidence_id}/download-url:
    get:
      tags:
        - "evidence"
      summary: "Kısa ömürlü imzalı indirme bağlantısı (yalnız taranmış dosya)"
      operationId: "download_url_v1_evidence__evidence_id__download_url_get"
      parameters:
        - name: "evidence_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Evidence Id"
        - name: "ttl"
          in: "query"
          required: false
          schema:
            anyOf:
              - type: "integer"
                minimum: 10
              - type: "null"
            title: "Ttl"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/evidence/files/{tenant_id}/{evidence_id}:
    get:
      tags:
        - "evidence"
      summary: "İmzalı dosya indirme (imza + süre doğrulanır)"
      description: "Bearer gerekmez; HMAC imzası ve süre doğrulanır. Süre dolunca 403. İmza yalnız bu tenant+kanıt için geçerlidir."
      operationId: "download_file_v1_evidence_files__tenant_id___evidence_id__get"
      parameters:
        - name: "tenant_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Tenant Id"
        - name: "evidence_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Evidence Id"
        - name: "exp"
          in: "query"
          required: true
          schema:
            type: "integer"
            title: "Exp"
        - name: "sig"
          in: "query"
          required: true
          schema:
            type: "string"
            title: "Sig"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/imports:
    post:
      tags:
        - "imports"
      summary: "İçe aktar (CSV multipart veya JSON satırlar) → 202 + job_id"
      description: "multipart/form-data: `file` (CSV, UTF-8, ayraç `,` veya `;`), `period_id`. JSON: `{\"period_id\",\"rows\":[...]}`.\nSütunlar: source_type, fuel, quantity, quantity_state, not_applicable_reason, unit, heating_value_basis, data_quality,\nactivity_start, activity_end, note. Aynı dosya ikinci kez → aynı iş; aynı satır → `duplicate`."
      operationId: "create_import_v1_imports_post"
      parameters:
        - name: "preview"
          in: "query"
          required: false
          schema:
            type: "boolean"
            default: false
            title: "Preview"
      responses:
        202:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/imports/{job_id}:
    get:
      tags:
        - "imports"
      summary: "İçe aktarma işini oku"
      operationId: "get_import_v1_imports__job_id__get"
      parameters:
        - name: "job_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Job Id"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/imports/{job_id}/rollback:
    post:
      tags:
        - "imports"
      summary: "İçe aktarmayı geri al (yalnız taslak kayıtlar geri çekilir)"
      description: "İşin yarattığı kayıtlardan hâlâ `draft` olanlar geri çekilir (withdrawn); hesaplanmış/onaylı olanlar korunur ve\n`kept` listesinde döner. Sürüm satırları silinmez (kural 9). Kilitli dönemde 409."
      operationId: "rollback_import_v1_imports__job_id__rollback_post"
      parameters:
        - name: "job_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Job Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ImportRollbackRequest"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  "/v1/exports/activities.csv":
    get:
      tags:
        - "exports"
      summary: "Faaliyet kayıtları CSV (UI ile aynı yetki ve filtre)"
      description: "Kural 2: miktar boş hücre (bilinmiyor) / \"0\" / `quantity_state` sütunu ile ayrılır; sayı asla float'a çevrilmez.\nMetin hücreleri `= + - @` ile başlıyorsa tek tırnakla etkisizleştirilir."
      operationId: "export_activities_v1_exports_activities_csv_get"
      parameters:
        - name: "period_id"
          in: "query"
          required: false
          schema:
            anyOf:
              - type: "string"
              - type: "null"
            title: "Period Id"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema: {}
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  /v1/factors:
    get:
      tags:
        - "catalog"
      summary: "Faktör kataloğu"
      operationId: "list_factors_v1_factors_get"
      parameters:
        - name: "factor_id"
          in: "query"
          required: false
          schema:
            anyOf:
              - type: "string"
              - type: "null"
            title: "Factor Id"
        - name: "status"
