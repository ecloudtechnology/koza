[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koza_calc"
version = "0.2.0"
description = "Koza deterministik sera gazı hesap motoru (saf Python, Decimal, I/O yok)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["koza_calc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
