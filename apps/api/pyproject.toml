[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koza-api"
version = "0.2.0"
description = "Koza iş API'si — yetki, tenant bağlamı, kayıt iş akışı, hesap/rapor/içe aktarma/kaynak uçları (Dilim 1)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
oidc = ["PyJWT[crypto]>=2.9"]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "PyJWT[crypto]>=2.9",
]

[tool.setuptools.packages.find]
include = ["koza_api*"]

[tool.setuptools.package-data]
koza_api = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
