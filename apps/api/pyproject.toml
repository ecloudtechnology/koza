[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koza-api"
version = "0.1.0"
description = "Koza iş API'si — yetki, tenant bağlamı, kayıt iş akışı, hesap/rapor uçları (Dilim 0)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["koza_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
