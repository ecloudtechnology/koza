[pytest]
# Üç test paketi (packages/calc-engine/tests, apps/api/tests, tests/isolation) tek komutta koşar.
# importlib modu, aynı adlı test modülü/paketlerinin birbirine karışmasını önler.
addopts = --import-mode=importlib -p no:cacheprovider
testpaths = packages/calc-engine/tests apps/api/tests tests/isolation
