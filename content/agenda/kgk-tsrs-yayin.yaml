title: "KGK, Türkiye Sürdürülebilirlik Raporlama Standartlarını (TSRS) yayımladı"
summary:
  - "Kamu Gözetimi Kurumu, sürdürülebilikle ilgili finansal açıklamaları düzenleyen TSRS'yi (TSRS 1 ve TSRS 2) resmî sayfasında yayımladı."
  - "Türkiye'de kurulu kurumları ilgilendirir; ancak hangi kurumların hangi dönemden itibaren zorunlu kapsamda olduğu KGK'nın kapsam kararına bağlıdır ve bu karar Koza'da henüz doğrulanmamıştır (K-08)."
  - "Protokoller sekmesinde TSRS kaynağı için uygulanabilirlik değerlendirmesi yapın; karar doğrulanana kadar sonuç 'inceleme gerekli' kalır ve yükümlülük görevi üretilmez."
publisher: "KGK (Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumu)"
