title: "GRI 102: Climate Change 2025 yayımlandı — 1 Ocak 2027 sonrası raporlar için geçerli"
summary:
  - "GRI, iklim değişikliği açıklamalarını yeni bir konu standardında (GRI 102: Climate Change 2025) topladı; Kapsam 1, 2 ve 3 açıklamaları, gazlar, sınırlar ve yöntem beyanı burada tanımlanıyor."
  - "GRI'ye uygun rapor yayımlayan her kurum için geçerli; kaynak, standardın 1 Ocak 2027 ve sonrasında yayımlanan rapor ve materyaller için uygulanacağını belirtiyor."
  - "2027'de yayımlanacak raporu bugünden planlayın: raporlama haritasında GRI 305 (2016) ↔ GRI 102 (2025) eşleştirmesini inceleyin ve açıklama boşluklarını görev olarak açın."
