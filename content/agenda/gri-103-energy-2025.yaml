title: "GRI 103: Energy 2025 yayımlandı — 1 Ocak 2027 sonrası raporlar için geçerli"
summary:
  - "GRI, enerji açıklamalarını güncelleyen yeni konu standardını (GRI 103: Energy 2025) yayımladı; enerji tüketimi ve ilgili açıklamalar bu standartta tanımlanıyor."
  - "Enerji tüketimi her kurumun çekirdek gösterge paketindedir; GRI raporunda enerji bölümü 1 Ocak 2027 ve sonrasında yayımlanan raporlarda bu standarda göre hazırlanır (kaynakta belirtilmiştir)."
  - "Enerji verisinin yakıt türü ve kaynak bazında ayrıştırılmış olduğunu kontrol edin; GRI 302 (2016) ile farkları raporlama haritasında izleyin."
