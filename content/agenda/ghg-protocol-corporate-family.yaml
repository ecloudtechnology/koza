title: "GHG Protocol kurumsal standart ailesi Koza'nın hesap dayanağı olarak kayıtlı"
summary:
  - "Corporate Standard, Scope 2 Guidance, Scope 3 Standard ve hesap rehberi Koza'da kaynak kartı olarak kayıtlı; Kapsam tanımları, envanter sınırı ve 15 kategori bu kaynaklardan gelir."
  - "Kurumsal envanter kuran her kurumu ilgilendirir; hesap motoru bu protokollerin sınır ve yöntem kurallarını uygular, raporlama standartları (GRI/TSRS) ise ne açıklanacağını söyler."
  - "Envanter sınırı yaklaşımınızın (operasyonel/finansal kontrol, özkaynak payı) kurulumda seçili ve gerekçeli olduğunu doğrulayın; Kapsam 2'de konum ve piyasa bazlı sonuçların ayrı tutulduğunu kontrol edin."
