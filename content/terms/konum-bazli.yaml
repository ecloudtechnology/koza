definition: >-
  Kapsam 2 hesabında, tüketilen elektriğin bulunduğu şebekenin ortalama emisyon faktörünü kullanan
  yöntem. Kurumun hangi tedarikçiyle sözleşme yaptığına bakmaz; "bu şebekeden çekilen elektrik
  ortalamada ne kadar emisyon üretir?" sorusuna cevap verir.
example: "Türkiye şebeke ortalama faktörü × tüketim (faktör sürümü ve yılı kayıtlı olmalı)."
confused_with: "Piyasa bazlı yöntemle karıştırılır; ikisi aynı tüketimin iki ayrı görünümüdür."
