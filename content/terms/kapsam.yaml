id: kapsam
tr: Kapsam (1, 2, 3)
en: Scope
definition: "Bir kurumun sera gazı emisyonlarının, emisyonun nerede oluştuğuna ve kurumun ilişkisine göre üç gruba ayrılması: Kapsam 1 kurumun kontrolündeki kaynaklardan doğrudan (ör. kazan); Kapsam 2 satın alınan elektrik, buhar, ısı ve soğutmanın üretiminden; Kapsam 3 değer zincirindeki diğer dolaylı emisyonlar (15 kategori)."
example: "Fabrikadaki doğal gaz kazanı → Kapsam 1. Şebekeden alınan elektrik → Kapsam 2. Tedarikçinin ürettiği çeliğin emisyonu → Kapsam 3 kategori 1."
confused_with: "Sistem sınırı (ürün çalışmalarındaki süreç sınırı) ile aynı şey değildir."
related_task: "Veri girişinde kaynak seçimi; kapsam sistem tarafından önerilir."
source: "K03 GHG Protocol Corporate Standard; K06 Scope 3 Standard"
status: editör onayı bekliyor
