contexts: [mevzuat]
definition: >-
  Emisyon ticaret sisteminde tesise belirli kurallara (ör. ürün benchmark'ı) göre bedelsiz verilen
  emisyon izni miktarı. Hesaplanan bir emisyon değil, kuralla belirlenen bir haktır; envanteri
  değiştirmez ve yalnız senaryo defterinde ele alınır. Benchmark değerleri koda yazılmaz.
example: "Tesisin yıllık emisyonu ile ücretsiz tahsisatı arasındaki fark (açık/fazla) senaryo defterinde hesaplanır."
confused_with: "Ürün/süreç tahsisi (allocation) ile karıştırılır; o bir hesap paylaştırma yöntemidir."
