        relation: partial
        note_tr: "Konum bazlı Kapsam 2 toplamı."
      - koza: corporate.scope2_kg.market
        relation: conditional
        note_tr: "Piyasa bazlı toplam; sözleşmesel araç varsa. Konum ve piyasa bazlı değerler toplanmaz."
      - koza: method.gwp_set
        relation: partial
        note_tr: "GWP seti ve kaynağı."
      - koza: boundary.approach
        relation: partial
        note_tr: "Konsolidasyon yaklaşımı."
      - koza: factor_sources
        relation: partial
        note_tr: "Şebeke / tedarikçi / artık karışım faktör kaynakları."
      - koza: base_year
        relation: partial
        note_tr: "Baz yıl alanı yok."
    narrative: ["kapsanan gazlar", "baz yıl", "yeniden hesaplama politikası", "sözleşmesel araç kalite ölçütleri", "standart ve yöntem beyanı"]
  - id: "305-3"
    title_tr: "Diğer dolaylı (Kapsam 3) sera gazı emisyonları"
    elements:
