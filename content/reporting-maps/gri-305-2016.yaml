id: gri-305-2016
framework: GRI
title: "GRI 305: Emisyonlar"
version: "2016"
applicable_from: null
source: K01
note_tr: "Koza'nın motor çıktısı yalnız sayısal unsurları besler. Her açıklama için baz yıl, konsolidasyon yaklaşımı, kullanılan standart/yöntem ve varsayımların anlatımı ayrı kanıt ister. GRI 102 (2025) yürürlüğe girdiğinde (1 Ocak 2027) 305-1/2/3 eşleştirmesi 102-5/6/7 ile birlikte okunur."
items:
  - id: "305-1"
    title_tr: "Doğrudan (Kapsam 1) sera gazı emisyonları"
    elements:
      - koza: corporate.scope1_kg
        relation: partial
        note_tr: "Brüt Kapsam 1 toplamı (yalnız onaylı/kilitli kayıtlar; eksik kaynak varsa 'hesaplanan envanter toplamı')."
      - koza: biogenic_co2_kg
        relation: conditional
        note_tr: "Biyojenik CO₂ ayrı raporlanır; yalnız ilgili kayıt varsa."
      - koza: method.gwp_set
        relation: partial
        note_tr: "Kullanılan GWP seti ve kaynağı; yöntem sürümüyle birlikte."
      - koza: boundary.approach
        relation: partial
        note_tr: "Konsolidasyon yaklaşımı (operasyonel kontrol / finansal kontrol / özkaynak)."
      - koza: factor_sources
        relation: partial
        note_tr: "Emisyon faktörü kimlikleri, sürümleri ve kaynak referansları."
      - koza: base_year
        relation: partial
        note_tr: "Baz yıl ve yeniden hesaplama politikası Koza veri modelinde henüz yok."
    narrative: ["gazlar ve kapsanan kaynaklar", "baz yıl seçimi ve gerekçesi", "yeniden hesaplama politikası", "varsayımlar", "standart ve yöntem beyanı"]
  - id: "305-2"
    title_tr: "Enerji dolaylı (Kapsam 2) sera gazı emisyonları"
    elements:
