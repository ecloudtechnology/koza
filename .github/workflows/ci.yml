name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    name: Hesap motoru + API + izolasyon testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/calc-engine -e "apps/api[dev]"
      - run: pytest packages/calc-engine/tests apps/api/tests tests/isolation -q
      - name: Altın set
        run: python -c "from koza_calc.golden import run_dir; r=run_dir('tests/golden'); print(r['passed'], r['failed']); assert r['failed']==0"
      - name: OpenAPI güncel mi
        run: |
          python apps/api/scripts/export_openapi.py && git diff --exit-code docs/api/openapi.yaml
  web:
    name: Arayüz derleme ve lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npm run build
